<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UNICO Healthcare — Statistics Suite</title>
<link rel="icon" type="image/svg+xml" href="unico/logo-mark.svg"/>
<!-- Offline IBM Plex fonts (vendored locally, no internet) -->
<link rel="stylesheet" href="vendor/fonts/ibm-plex.css"/>
<link rel="stylesheet" href="unico/theme.css"/>
<!-- Early asset discovery: the scripts live at the END of <body>, so without these
     hints the browser only finds them after parsing the whole document. Preloading
     here starts the (cached, immutable) downloads in parallel with the CSS. The
     bundle's ?v= token is kept in sync by scripts/build-renderer.js. -->
<link rel="preload" href="vendor/react.production.min.js" as="script"/>
<link rel="preload" href="vendor/react-dom.production.min.js" as="script"/>
<link rel="preload" href="dist/app.bundle.js?v=5945239053" as="script"/>
<style>
/* Boot splash — visible from the first byte of HTML until React mounts (its first
   render replaces #root's children). Styled inline so it needs no other asset. */
#boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:#eef2f7;z-index:9999;
  font-family:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif}
#boot-splash img{height:40px;opacity:.92}
#boot-splash .spin{width:26px;height:26px;border-radius:50%;
  border:3px solid rgba(39,168,219,.25);border-top-color:#27a8db;
  animation:unico-spin .8s linear infinite}
#boot-splash .msg{font-size:12.5px;font-weight:600;color:#5b6b80;letter-spacing:.2px}
@keyframes unico-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root">
  <div id="boot-splash">
    <img src="unico/logo.svg" alt="UNICO Healthcare"/>
    <div class="spin"></div>
    <div class="msg" id="boot-splash-msg">Loading the Statistics Suite&hellip;</div>
  </div>
</div>
<script>
// If the app hasn't mounted after a while, tell the user instead of spinning forever.
setTimeout(function(){
  var m = document.getElementById('boot-splash-msg');
  if (m) m.textContent = 'Still loading… a slow connection can take a moment. If nothing appears, refresh the page.';
}, 15000);
</script>
<!-- Off-screen render target for PDF/print export (Reports). Only this node is
     shown under @media print; #root is hidden. See theme.css + reports.jsx. -->
<div id="pdf-root"></div>
<!-- Vendored libraries — run fully offline, no CDN. All external scripts are
     `defer`red: they download in parallel without blocking HTML parsing and still
     execute in document order (react -> react-dom -> bundle).
     The inline DB-bridge below is NOT deferred, so it always runs first. -->
<script defer src="vendor/react.production.min.js"></script>
<script defer src="vendor/react-dom.production.min.js"></script>
<!-- PDF export (offline, vendored): jsPDF + html2canvas are ~160 KB that every page view used to
     download and parse, although only a PDF export uses them. They now load on demand. -->
<script>
(function(){
  var pending = null;
  function load(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error('Could not load ' + src)); };
      document.head.appendChild(s);
    });
  }
  // Resolves once both libraries are on window; a failed load is forgotten so the next export retries.
  window.unicoLoadPdfLibs = function(){
    if (window.jspdf && window.html2canvas) return Promise.resolve();
    if (!pending) {
      pending = Promise.all([
        window.jspdf ? null : load('vendor/jspdf.umd.min.js'),
        window.html2canvas ? null : load('vendor/html2canvas.min.js')
      ]).catch(function(e){ pending = null; throw e; });
    }
    return pending;
  };
})();
</script>
<!-- Database bridge: hydrate localStorage from the on-disk DB, then mirror every
     change back to it. Runs before the app's stores read localStorage. -->
<script>
(function(){
  var n = window.unicoNative;
  if(!n){ return; } // opened outside the desktop shell — fall back to plain localStorage
  try{
    // 1) Hydrate: the database is the source of truth at startup.
    var snap = n.snapshot || {};
    // The server sends each session ONLY the modules it may see, so any unico_* key it
    // did NOT send must be cleared first. Without this, a shared workstation leaked the
    // previous user across the sign-out: an admin's quality and statistics overlays
    // stayed in localStorage and the next, lower-privileged user read them straight
    // out of the browser. Keys that are purely local client config are kept.
    var KEEP = { unico_api_base:1, unico_session_token:1, unico_session_user:1 };
    if(window.__UNICO_SNAPSHOT_AUTHORITATIVE__){
      try{
        var stale = [];
        for(var i=0;i<localStorage.length;i++){
          var key = localStorage.key(i);
          // Device-only drafts ("saved on this device") are never on the server, so their absence
          // from the snapshot is not a signal to delete them.
          if(key && key.indexOf('unico_')===0 && !KEEP[key] && key.indexOf('unico_dc_draft_v1|')!==0 && !Object.prototype.hasOwnProperty.call(snap,key)) stale.push(key);
        }
        for(var j=0;j<stale.length;j++){ try{ localStorage.removeItem(stale[j]); }catch(e){} }
      }catch(e){ try{ console.error('[unico-db] purge', e); }catch(_){} }
    }
    for(var k in snap){ if(Object.prototype.hasOwnProperty.call(snap,k)){ try{ localStorage.setItem(k, snap[k]); }catch(e){} } }
  }catch(e){ try{ console.error('[unico-db] hydrate', e); }catch(_){} }
  try{
    function hasOwn(o,k){ return Object.prototype.hasOwnProperty.call(o,k); }
    // localStorage is SHARED by every tab, and another tab loading hydrates it from the server.
    // That used to replace this tab's UNSAVED edit, so its next save saw "nothing changed" and
    // the edit was lost. Saves therefore read this tab's unconfirmed values (`pending`) instead.
    function snapshotAll(){ var all={}; for(var i=0;i<localStorage.length;i++){ var key=localStorage.key(i); all[key]=localStorage.getItem(key); } for(var p in pending){ if(hasOwn(pending,p)){ if(pending[p]===null) delete all[p]; else all[p]=pending[p]; } } return all; }
    window.unicoSnapshotAll = snapshotAll;
    window.unicoFlushNow = flush;
    window.unicoNative = n;

    // 2) Mirror: persist the state to the database (debounced) on any write.
    // Which keys changed since the last successful save — used by the closing-tab
    // flush below so it can send a small payload instead of the whole 130 KB blob.
    // pending: key -> value this tab wrote and the server has not confirmed (null = removed).
    var dirty = {}, dropped = {}, pending = {}, reapplied = {}, anyDirty = false, revision = 0, saveEpoch = 0;
    function syncable(k){ return typeof k==='string' && k.indexOf('unico_')===0 && !(KEEP && KEEP[k]) && k.indexOf('unico_dc_draft_v1|')!==0; }
    function markDirty(k, isRemoval, value){ if(k==null) return; revision++; anyDirty=true; if(isRemoval){ dropped[k]=1; delete dirty[k]; } else { dirty[k]=1; delete dropped[k]; } if(syncable(k)) pending[k] = isRemoval ? null : value; }
    function clearDirty(r, savedRevision){ if(revision===savedRevision && (!r || r.ok!==false)){ dirty={}; dropped={}; pending={}; anyDirty=false; } return r; }
    // The banner promises "saving resumes automatically", but nothing retried after the last
    // in-request retry. Keep trying every 30 s while anything is unsaved; stop once clean.
    // A refusal (403) or an expired session cannot be fixed by retrying.
    var retryTimer=null;
    function afterSave(r){
      if(!anyDirty || (r && (r.forbidden || /session expired/i.test(String(r.error||''))))){ if(retryTimer){ clearTimeout(retryTimer); retryTimer=null; } }
      else if(!retryTimer){ retryTimer=setTimeout(function(){ retryTimer=null; if(anyDirty) flush(); }, 30000); }
      return r;
    }

    var timer=null;
    // Returns persist()'s result unchanged (the monitor wrapper and unicoFlushNow callers rely on it).
    function flush(){ clearTimeout(timer); var saving=revision; saveEpoch++;
      try{ return n.persist(snapshotAll()).then(function(r){ saveEpoch++; return afterSave(clearDirty(r,saving)); }, function(e){ saveEpoch++; afterSave(null); throw e; }); }
      catch(e){ saveEpoch++; afterSave(null); return Promise.resolve({ok:false}); } }
    function schedule(){ clearTimeout(timer); timer=setTimeout(flush, 200); }
    var proto = Object.getPrototypeOf(localStorage) || window.Storage.prototype;
    var remoteSetItem = proto.setItem, remoteRemoveItem = proto.removeItem;
    // Hydration is a read, not a user edit. Do not echo a fetched roster back — and do
    // not let it replace a key this tab changed and has not had confirmed yet. A read
    // that started before the edit carries the OLD value; applying it mid-save made the
    // next save send that old value as a deliberate change, deleting what was just saved.
    // Returns which keys were applied.
    window.unicoApplyRemoteData = function(data){
      var applied = {}, accepted = {};
      Object.keys(data).forEach(function(k){
        if(dirty[k] || dropped[k]){ applied[k] = false; return; }
        remoteSetItem.call(localStorage,k,data[k]); accepted[k] = data[k]; applied[k] = true;
      });
      if(n.acceptSnapshot) n.acceptSnapshot(accepted);
      return applied;
    };
    // Adopt a value the server MERGED with another session's saves. Only if this key still
    // holds exactly what was sent — if the user typed again meanwhile, their newer value stays
    // and the next save merges again. Raw setter: adopting is not a new edit to echo back.
    window.unicoAdoptMerged = function(k, sentValue, mergedValue){
      if(localStorage.getItem(k) !== sentValue) return false;
      remoteSetItem.call(localStorage, k, mergedValue);
      return true;
    };
    // web-native.js calls this once the server accepted a save: those exact values need no guarding.
    window.unicoConfirmSaved = function(data, removed){
      Object.keys(data||{}).forEach(function(k){ if(hasOwn(pending,k) && pending[k]===data[k]) delete pending[k]; });
      (removed||[]).forEach(function(k){ if(hasOwn(pending,k) && pending[k]===null) delete pending[k]; });
    };
    // Apply server overlay values read elsewhere (GET /api/data, the collector overlay riding
    // /api/departments|/api/quality) and tell the mounted stores, which otherwise keep the old
    // overlay in React state and write it back on their next change. Only keys whose server value
    // moved past this tab's baseline are written (an unchanged key would needlessly clobber
    // another tab's unsaved copy); dirty keys are skipped by unicoApplyRemoteData.
    // opts.knownOnly: only keys this session received at load or has saved since.
    window.unicoApplyRemoteOverlay = function(data, opts){
      var feed = {}, changed = [];
      Object.keys(data||{}).forEach(function(k){
        var v = data[k];
        if(typeof v!=='string' || !syncable(k)) return;
        var base = n.baseOf ? n.baseOf(k) : localStorage.getItem(k);
        if((opts && opts.knownOnly && base===null) || v===base) return;
        feed[k] = v;
      });
      if(!Object.keys(feed).length) return changed;
      var applied = window.unicoApplyRemoteData(feed);
      Object.keys(applied).forEach(function(k){ if(applied[k]) changed.push(k); });
      if(changed.length){ try{ window.dispatchEvent(new CustomEvent('unico:overlay-merged', { detail: { keys: changed, source: (opts && opts.source) || 'remote' } })); }catch(e){} }
      return changed;
    };
    // Idle tabs never saw overlay edits saved elsewhere (Data Entry cells, renames, indicator
    // patches, CAPA, presets): the web app only read the overlay at page load. Portal accounts
    // receive no shared blob (their overlay rides /api/departments + /api/quality). The staff
    // register is left to the staff store's own refresh (row merge + conflict parking).
    window.unicoRefreshAppData = function(opts){
      var u = window.__UNICO_USER__;
      if(!n.isWeb || typeof fetch!=='function' || (u && ['collector','incharge','nurse','pca'].indexOf(u.role)>=0)) return Promise.resolve(null);
      var rev0 = revision, epoch0 = saveEpoch;
      return fetch('/api/data', { credentials:'same-origin', cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
        if(!j || !j.ok || !j.data || typeof j.data!=='object') return null;
        // A local write or save happened while this read was in flight: the read may predate that
        // save, and applying it would put the old value back as if the server had moved. Next round.
        if(revision!==rev0 || saveEpoch!==epoch0) return null;
        var data = Object.assign({}, j.data); delete data.unico_staff_v3;
        return window.unicoApplyRemoteOverlay(data, { knownOnly: !(opts && opts.includeNew), source: 'appdata' });
      }).catch(function(){ return null; });
    };
    // Another tab overwrote (hydration, purge, its own edit) a key THIS tab changed and has not had
    // confirmed: put this tab's value back and save; the server's 3-way merge reconciles both.
    // Rate-limited per key so two tabs with unsaved edits to one key cannot ping-pong forever.
    window.addEventListener('storage', function(e){
      try{
        if(e.storageArea && e.storageArea!==localStorage) return;
        var keys = e.key==null ? Object.keys(pending) : [e.key], again = false, now = Date.now();
        keys.forEach(function(k){
          if(!hasOwn(pending,k)) return;
          var mine = pending[k];
          if(localStorage.getItem(k)===mine || (n.baseOf && mine!==null && mine===n.baseOf(k))) return;
          if(now-(reapplied[k]||0)<3000) return;
          reapplied[k] = now;
          if(mine===null) remoteRemoveItem.call(localStorage,k); else remoteSetItem.call(localStorage,k,mine);
          again = true;
        });
        if(again) schedule();
      }catch(err){ try{ console.error('[unico-db] storage', err); }catch(_){} }
    });
    ['setItem','removeItem','clear'].forEach(function(m){
      var orig = proto[m];
      proto[m] = function(){
        var before = m==='setItem' || m==='removeItem' ? this.getItem(arguments[0]) : null;
        var r = orig.apply(this, arguments);
        if(this!==localStorage || (m==='setItem' && before===String(arguments[1])) || (m==='removeItem' && before===null)) return r;
        if(m==='clear'){ revision++; anyDirty=true; } else { markDirty(arguments[0], m==='removeItem', m==='setItem' ? String(arguments[1]) : null); }
        schedule();
        return r;
      };
    });

    // 3) Don't lose the last edit when the page goes away. The save is debounced by
    // 200ms, so closing the tab, switching apps or letting the laptop sleep within that
    // window meant the change was never sent and never missed — the single most common
    // cause of "I entered it but it didn't save".
    //   - 'hidden' fires while the page is still fully alive: do the normal save, with
    //     its retries.
    //   - 'pagehide' is the last moment we get: send just the changed keys with
    //     keepalive, which the browser is allowed to finish after the tab is gone.
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState==='hidden' && anyDirty) flush();
    });
    window.addEventListener('pagehide', function(){
      if(!anyDirty) return;
      var payload = { partial:true, data:{}, removed:Object.keys(dropped) };
      Object.keys(dirty).forEach(function(k){ var v=hasOwn(pending,k) ? pending[k] : localStorage.getItem(k); if(v!==null) payload.data[k]=v; });
      if(n.staffBase && (Object.prototype.hasOwnProperty.call(payload.data,'unico_staff_v3') || payload.removed.indexOf('unico_staff_v3')>=0)) payload.staffBase=n.staffBase();
      if(!Object.keys(payload.data).length && !payload.removed.length) return;
      // Baselines let the server merge instead of overwrite (see web-native.js changes()).
      // Browsers refuse keepalive bodies over ~64 KB, so include them only while they fit.
      if(n.baseOf){ var bases={}; Object.keys(payload.data).forEach(function(k){ if(k!=='unico_staff_v3'){ var b=n.baseOf(k); if(b!=null) bases[k]=b; } }); payload.bases=bases; if(JSON.stringify(payload).length>60000) delete payload.bases; }
      try{
        fetch('/api/data', { method:'PUT', headers:{'content-type':'application/json'},
          body: JSON.stringify(payload), keepalive:true, credentials:'same-origin' });
      }catch(e){ /* nothing more we can do at this point */ }
    });
  }catch(e){ try{ console.error('[unico-db] mirror', e); }catch(_){} }
})();
</script>

     by `npm run web`; the ?v= token is the bundle's content hash (auto-updated). -->
<script defer src="dist/app.bundle.js?v=5945239053"></script>
</body>
</html>
